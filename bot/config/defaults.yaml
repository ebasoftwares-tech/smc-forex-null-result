# Resolved defaults for the SMC bot.
#
# Every value here is traceable to a section of SMC_STRATEGY_SPECIFICATION_v1.0.md
# and a class in PARAMETERS.md.  Changing a FROZEN default starts a new study and
# requires a DECISIONS.md entry (PARAMETERS.md section 5).
#
# Phase 1 scope: data, tf, week, session, atr.

symbols:
  # Development set first (BACKTEST_PROTOCOL.md section 2.1), then the validation set.
  - EURUSD
  - GBPUSD
  - USDJPY
  - AUDUSD
  - USDCAD
  - USDCHF
  - NZDUSD
  - EURJPY
  - GBPJPY
  - EURGBP

data:
  ingest_timeframe: M1
  max_gap_bars: 3
  spike_filter_atr: 10.0

tf:
  # DECISION D-001 (2026-08-25): UTC, not America/New_York.
  # The H4 grid is therefore fixed at 00/04/08/12/16/20 UTC year-round.
  day_boundary_tz: UTC
  day_boundary_time: "00:00"
  # DECISION D-001a: the Sunday 21:00-24:00 UTC stub would otherwise become
  # Monday's PDH/PDL.  SPEC 2.6.1.
  sunday_handling: merge_into_monday
  stub_merge_threshold: 0.25
  min_bar_coverage_warn: 0.50

week:
  open_day: Sun
  open_time: "21:00"
  close_day: Fri
  close_time: "21:00"
  anchor_tolerance_hours: 1.0

atr:
  period: 14

# SPEC 5.  N decreases with timeframe height because higher timeframes have fewer
# bars, not because they are less noisy.  Monthly N=1 is forced by data availability
# and its consequence -- low-resolution, slow monthly structure -- is accepted and
# flagged in SPEC 7.7 rather than engineered around.
swing:
  fractal_n:
    MN1: 1
    W1: 1
    D1: 2
    H4: 2
    H1: 3
    M15: 5
  tie_rule: leftmost
  price_source: wick
  min_history:
    MN1: 36
    W1: 104
    D1: 250
    H4: 500
    H1: 1000
    M15: 2000

# SPEC 6.
structure:
  break_confirmation: close
  min_break_penetration_atr: 0.0
  on_wick_below_protected: keep
  min_bars_between_flips: 2
  protected_on_bos: most_recent_low

# SPEC 8.  Every level traces to one of the enumerated sources.  Round numbers,
# Fibonacci levels, pivots, moving averages and option strikes are deliberately NOT
# liquidity in v1.0: each would be defensible, and each multiplies the level population
# and therefore the number of "sweeps" available to find (SPEC 8.3).
liq:
  enabled_sources:
    - PREV_DAY
    - PREV_WEEK
    - PREV_MONTH
    - SESSION
    - SWING
    - EQUAL
    - PROTECTED_SWING
  swing_timeframes: [H4, D1]
  merge_tolerance_atr: 0.10
  max_distance_atr: 5.0
  invalidate_closes: 2
  invalidate_buffer_atr: 0.25
  max_age_d1_bars:
    "1": 90
    "2": 30
    "3": 5
  max_active_levels: 40
  rank_tier_weight:
    "1": 3.0
    "2": 2.0
    "3": 1.0
  rank_strength_weight: 0.5
  rank_recency_weight: 1.0
  rank_bias_weight: 1.0
  # DECISION D-002: every tier confirms on H4.  {"3": "H1"} is the ablation.
  tier_confirmation_tf:
    "1": H4
    "2": H4
    "3": H4

# SPEC 9.  A sweep is penetration THEN reclaim, both bounded in size and time.
# Failure to reclaim is not "no event": it invalidates the level and is logged, because
# the ratio of confirmed to failed sweeps per source is a direct measure of whether a
# level is a real barrier.
sweep:
  max_confirmation_bars: 3
  min_penetration_atr: 0.05
  max_penetration_atr: 1.00
  reclaim_buffer_atr: 0.0
  min_wick_ratio: 0.0
  min_close_position: 0.0
  # SPEC 9.2.1: swing-derived sources only.
  require_prior_level_age_bars: 3
  # SPEC 9.6: the WAIT step is structural.  Consumed by Phase 9.
  same_bar_choch_allowed: false

# SPEC 10.  Displacement is measured over a LEG ending at the structure-break bar:
# a two-bar drive and a one-bar drive of the same magnitude are the same event.
disp:
  mode: leg
  min_leg_atr: 1.5
  min_body_ratio: 0.50
  min_directional_bars: 1
  max_leg_bars: 3
  # SPEC 10.2: the FVG requirement is the same condition expressed structurally, not an
  # extra filter -- and it produces the object entry model C needs.
  require_fvg: true
  min_range_atr: 1.5

# SPEC 11.  `reference_mode` is not an ordinary parameter: major and micro are two
# separately pre-registered STRATEGIES (11.1), and must be reported as such rather than
# as a sweep.  The window below is what makes this a multi-session swing model -- 12 H4
# bars is two trading days from sweep to MSS (D-002).
choch:
  reference_mode: major
  max_reference_lookback: 30
  max_reference_distance_atr: 3.0
  max_bars_after_sweep: 12
  # The WAIT (SPEC 9.6): measured from the sweep EXTREME, while knowability is measured
  # from the sweep CONFIRM bar.  Both bind -- see D-009.
  min_bars_after_sweep: 1
  micro_fractal_n: 1

invalidate:
  new_extreme_atr: 0.10

# SPEC 12.  Detection only in Phase 8; lifecycle fields are consumed from Phase 10.
fvg:
  min_size_atr: 0.10
  min_size_pips: 0.5
  exclude_weekend_gaps: true
  mitigation_mode: ce
  invalidate_buffer_atr: 0.0
  max_age_bars: 30
  merge_overlapping: false
  selection: first

# SPEC 13.  `definition` is four pre-registered VARIANTS, not a knob: 13.1 states that the
# standard formulation is under-specified in three places and that the choices produce
# zones tens of pips apart.  13.8 requires the agreement matrix alongside any comparison,
# so that near-identical variants are not counted as independent tests.
ob:
  definition: last_opposing
  zone_mode: full_range
  max_lookback_bars: 10
  max_distance_atr: 3.0
  max_age_bars: 30
  invalidate_closes: 1

# SPEC 14.4 / 15.  The five entry models are five pre-registered VARIANTS run over one
# shared setup stream (15.8), so the comparison is paired.  Compare on expectancy per
# SETUP, never per trade: B-E do not always fill, and a model that fills on the
# best-looking third of setups shows a better win rate and a worse total return (15.5).
setup:
  max_active_per_symbol: 2
  max_active_per_direction: 1
  max_armed_orders: 1

entry:
  model: C
  retrace_pct: 0.50
  fvg_entry_point: ce
  ob_entry_point: proximal
  pending_expiry_bars: 6
  cancel_on_bias_flip: true
  # SPEC 15.7: a fallback chain makes per-model statistics uninterpretable.
  fallback_model: none

# SPEC 16.  Phase 12 implements S1 only -- cancel_if clause 1 needs a planned stop before
# an order can be armed.  The buffer is the ATR term alone; 16.2's spread and stops-level
# terms need a broker and real spread data (Q1/Q2).
sl:
  model: sweep_extreme
  buffer_atr: 0.10
  buffer_spread_mult: 2.0
  atr_multiple: 1.5

exec:
  latency_ms: 250

# SPEC 17.1/17.2 -- Phase 13 implements target PLACEMENT and the minimum-RR gate.
# 17.3's break-even and trailing, 17.4's exits and the EXECUTION of T3's ladder and T4's
# trail need an open trade and belong to Phase 14.
#
# ladder_first_r is the `tp_1` that 17.2's gate measures for T3.  At 1.0 against
# min_rr 1.5 the gate rejects T3 on every setup -- a contradiction between two
# specification defaults, recorded in DECISION D-014 section 1 and deliberately NOT
# resolved by editing either number here.
tp:
  model: fixed_r
  r_multiple: 2.0
  min_rr: 1.5
  below_min_rr_action: skip
  min_target_rank: 2.0
  target_buffer_atr: 0.15
  ladder_first_r: 1.0

# SPEC 16.3's stop caps and SPEC 18 in full.
#
# Three of these cannot fire as configured, and all three are left alone -- see
# DECISION D-014 sections 2, 3 and 4.  BACKTEST_PROTOCOL section 10.2 forbids moving a
# parameter to make a result appear, and a check moved because it never fires is still
# a parameter moved after seeing the outcome:
#
#   max_total_open_risk_pct  unreachable -- max_open_positions binds first, always
#   min_realised_fraction    unreachable at 0.5 on any lot grid (k/(k+1) >= 1/2)
#   max_sl_atr               unreachable under stop model S4 (1.5 ATR < 2.5 ATR)
risk:
  max_sl_atr: 2.5
  max_sl_pips: {default: 60.0, JPY: 90.0}
  min_sl_pips: {default: 8.0, JPY: 12.0}
  pct_per_trade: 0.35
  counter_monthly_multiplier: 0.5
  max_total_open_risk_pct: 1.5
  max_daily_loss_pct: 2.0
  max_weekly_loss_pct: 4.0
  max_monthly_loss_pct: 8.0
  max_consecutive_losses: 5
  consecutive_loss_pause_hours: 24
  max_open_positions: 3
  max_positions_per_symbol: 1
  max_correlated_positions: 2
  correlation_threshold: 0.70
  correlation_window_days: 60
  max_spread_pips: {default: 2.0, JPY: 3.5}
  max_spread_pct_of_sl: 10.0
  equity_dd_kill_pct: 10.0
  # SPEC 18.5, as (drawdown_pct, multiplier).  Validated monotone non-increasing with no
  # multiplier above 1.0 -- SPEC 18.1's anti-martingale invariant, enforced at load time
  # so that no configuration can express its violation.
  dd_ladder: [[5.0, 0.75], [8.0, 0.50]]
  min_realised_fraction: 0.5

# SPEC 18.2.  starting_equity is FROZEN for reporting only: it scales the equity curve
# and not the edge, but it decides which trades the lot-granularity rejections eliminate,
# so the Phase 13 report sweeps it rather than quoting it.
account:
  currency: USD
  starting_equity: 10000.0

# SPEC 17.3.  Break-even is OFF by default and the spec says why: it "reliably raises
# win rate and reliably lowers expectancy on most systems; enabling it by default would
# flatter the headline statistic that matters least."
manage:
  be_trigger_r: 0.0
  be_offset_atr: 0.05
  trail_mode: none
  trail_atr_mult: 2.0
  trail_start_r: 1.0

# SPEC 17.4.  close_before_high_impact_news is FROZEN false: it needs a calendar feed
# (Q13), and any live behaviour the backtest cannot reproduce is prohibited -- otherwise
# the live system and the tested system are different systems.
exit:
  max_bars_in_trade: 30
  close_before_weekend: true
  weekend_close_utc: "19:00"
  weekend_close_day: Fri
  close_before_high_impact_news: false

# SPEC 26.  Stops slip MORE than entries, deliberately: "stops fill worse than limits;
# modelling them symmetrically is a systematic optimism."
slip:
  entry_pips: 0.2
  entry_atr_mult: 0.02
  stop_pips: 0.5
  stop_atr_mult: 0.05

# SPEC 26 / BACKTEST_PROTOCOL 3.3.  `multiplier` is the mandatory cost-sensitivity
# dimension -- every headline result is reported at 1.0, 1.5 and 2.0.  spread_model is
# the session-constant fallback because there is no tick spread series until Q2, and
# swap_pips_per_day is empty because there is no broker table until Q1: zero beats an
# invented financing cost, and the reports say so.
cost:
  commission_per_lot_per_side: 3.5
  spread_model: session_constant
  spread_pips_active: {default: 0.8, JPY: 1.2}
  spread_pips_quiet: {default: 1.6, JPY: 2.4}
  multiplier: 1.0
  swap_pips_per_day: {}

# SPEC 19 / 21.3.  The horizon over which a rejected setup's forward move is recorded,
# which is what turns the rejection log into a counterfactual dataset answerable without
# a second backtest run.
analysis:
  forward_bars: 12

# SPEC 18.6.  The file trigger exists because a kill switch that can only fire
# automatically cannot be used by the person watching the screen.
ops:
  max_data_staleness_sec: 300
  max_broker_errors: 5
  kill_switch_file: KILL_SWITCH

# symbol_specs (SPEC 1.4) is deliberately NOT written out here.  It is ten identical
# standard-FX blocks that the schema's own factory produces, so spelling them out would
# add no information and create a drift risk between the two.  Every value in it is a
# declared default rather than a broker-measured one until Q1 picks a broker; the reports
# say so wherever they use one.


# SPEC 17.5: m1_path is the only correct option; `ohlc_heuristic` is prohibited by the
# spec and is not offered as a value at all.
backtest:
  intrabar_mode: m1_path
  limit_fill_buffer_pips: 0.2

eq:
  min_touches: 2
  tolerance_atr: 0.10
  min_separation_bars: 3
  max_span_bars: 50
  cluster_price: extreme

# SPEC 8.5.2.  Not in liq.enabled_sources by default -- ABLATION-ONLY.
range:
  window_bars: 20
  max_height_atr: 2.0
  max_breakout_bars: 3

session:
  source_tf: M15
  min_bar_coverage: 0.60
  windows:
    - name: ASIA
      tz: Asia/Tokyo
      start: "09:00"
      end: "18:00"
      days: [Mon, Tue, Wed, Thu, Fri]
      role: liquidity

    - name: LONDON
      tz: Europe/London
      start: "08:00"
      end: "16:30"
      days: [Mon, Tue, Wed, Thu, Fri]
      role: liquidity+execution

    - name: NEW_YORK
      tz: America/New_York
      start: "08:00"
      end: "17:00"
      days: [Mon, Tue, Wed, Thu, Fri]
      role: liquidity+execution

    # The ICT-convention "Asian range".  Deliberately distinct from ASIA above;
    # the two definitions disagree and the disagreement is measurable (SPEC 3.2).
    # Under D-001 this window now ends INSIDE the UTC trading day rather than on
    # its boundary - see the note in SPEC 3.2.
    - name: ASIA_RANGE
      tz: America/New_York
      start: "20:00"
      end: "00:00"
      days: [Sun, Mon, Tue, Wed, Thu]
      role: liquidity

    - name: LONDON_KZ
      tz: America/New_York
      start: "02:00"
      end: "05:00"
      days: [Mon, Tue, Wed, Thu, Fri]
      role: killzone
      enabled: false

    - name: NY_KZ
      tz: America/New_York
      start: "07:00"
      end: "10:00"
      days: [Mon, Tue, Wed, Thu, Fri]
      role: killzone
      enabled: false
